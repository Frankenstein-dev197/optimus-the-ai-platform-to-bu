name: Build All Applications

# Workflow manuel pour compiler toutes les applications
on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Application à compiler (all, web, platform, api)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - web
          - platform
          - api

jobs:
  build-web:
    name: Build Landing Page
    runs-on: ubuntu-latest
    if: ${{ inputs.app == 'all' || inputs.app == 'web' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter @optimus/web build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/.next
          retention-days: 1

  build-platform:
    name: Build Optimus Dev Platform
    runs-on: ubuntu-latest
    if: ${{ inputs.app == 'all' || inputs.app == 'platform' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build platform app
        run: pnpm --filter @optimus-ide-collab/optimus-dev build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: platform-build
          path: apps/platform/.next
          retention-days: 1

  build-api:
    name: Build API Service
    runs-on: ubuntu-latest
    if: ${{ inputs.app == 'all' || inputs.app == 'api' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API service
        run: pnpm --filter @optimus/api-service build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-build
          path: services/api/dist
          retention-days: 1

  lint-all:
    name: Lint All
    runs-on: ubuntu-latest
    if: ${{ inputs.app == 'all' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm --filter @optimus/web lint || true
