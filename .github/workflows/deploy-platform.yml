name: Deploy Optimus Dev Platform

on:
  push:
    branches: [main]
    paths:
      - 'apps/platform/**'
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'

jobs:
  deploy-platform:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    
    environment:
      name: production
      url: https://dev.optimus-ide-collabidecollab.com
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add -g vercel

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --projectName=optimus-dev --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Platform App
        run: vercel build --prod --projectName=optimus-dev --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --projectName=optimus-dev --token=${{ secrets.VERCEL_TOKEN }}
